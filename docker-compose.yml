services:
  postgres:
    image: postgres:16-alpine
    container_name: dangbe-postgres
    environment:
      POSTGRES_USER: dangbe
      POSTGRES_PASSWORD: dangbe
      POSTGRES_DB: dangbe
    ports:
      - '5433:5432'
    volumes:
      - dangbe-pg:/var/lib/postgresql/data
volumes:
  dangbe-pg:
